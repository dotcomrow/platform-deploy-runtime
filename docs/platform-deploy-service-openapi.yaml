openapi: 3.0.3
info:
  title: Platform Deploy API
  version: 1.0.0
  description: Internal Kubernetes control plane for Directus-managed shell app deployments.
servers:
  - url: http://platform-deploy-service.directus.svc.cluster.local:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Service health
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Dependency readiness
  /internal/apps/{id}/deploy:
    post:
      operationId: queueDeploy
      parameters:
        - $ref: "#/components/parameters/AppIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueDeployRequest"
      responses:
        "200":
          description: Deploy queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueOperationResponse"
        "422":
          description: Deploy configuration is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/apps/{id}/destroy:
    post:
      operationId: queueDestroy
      parameters:
        - $ref: "#/components/parameters/AppIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueDestroyRequest"
      responses:
        "200":
          description: Destroy queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueOperationResponse"
  /internal/operations/{id}/steps:
    get:
      operationId: listOperationSteps
      parameters:
        - $ref: "#/components/parameters/OperationIdPath"
      responses:
        "200":
          description: Detailed status steps for a platform app operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOperationStepsResponse"
  /internal/operations/{id}/steps/{stepKey}:
    post:
      operationId: recordOperationStep
      parameters:
        - $ref: "#/components/parameters/OperationIdPath"
        - $ref: "#/components/parameters/StepKeyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationStepStatusRequest"
      responses:
        "200":
          description: Step status recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationStepStatusResponse"
        "422":
          description: Step key or payload was invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/secrets/platform-deploy:
    get:
      operationId: getPlatformDeploySecrets
      responses:
        "200":
          description: Platform deploy secrets loaded from Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlatformDeploySecretsResponse"
    post:
      operationId: savePlatformDeploySecrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePlatformDeploySecretsRequest"
      responses:
        "200":
          description: Platform deploy secrets saved to Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavePlatformDeploySecretsResponse"
        "422":
          description: One or more required secret fields are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    AppIdPath:
      name: id
      in: path
      required: true
      description: Directus platform_apps id.
      schema:
        type: string
        format: uuid
    OperationIdPath:
      name: id
      in: path
      required: true
      description: Directus platform_app_operations id.
      schema:
        type: string
        format: uuid
    StepKeyPath:
      name: stepKey
      in: path
      required: true
      description: Stable deployment step key such as prod-deploy or preview-destroy.
      schema:
        type: string
        minLength: 1
  schemas:
    QueueDeployRequest:
      type: object
      additionalProperties: false
      properties:
        operation_type:
          type: string
          enum:
            - create
            - update
            - redeploy
          description: Deployment operation to queue.
    QueueDestroyRequest:
      type: object
      additionalProperties: false
      properties:
        operation_type:
          type: string
          enum:
            - destroy
            - delete
          description: Destroy operation to queue.
    QueueOperationResponse:
      type: object
      required:
        - ok
        - app_id
        - operation_id
      additionalProperties: true
      properties:
        ok:
          type: boolean
        app_id:
          type: string
        operation_id:
          type: string
        operation_type:
          type: string
          enum:
            - create
            - update
            - redeploy
            - delete
            - destroy
        requested_operation_type:
          type: string
          enum:
            - create
            - update
            - redeploy
            - delete
            - destroy
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
        active:
          type: boolean
        duplicate:
          type: boolean
        idempotent:
          type: boolean
        reason:
          type: string
        message:
          type: string
        flink_job_id:
          type: string
        prepared_topic:
          type: string
    OperationStepStatusRequest:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
        app_id:
          type: string
          format: uuid
        step_label:
          type: string
        sequence:
          type: integer
          minimum: 0
        message:
          type: string
        result_json:
          type: object
          additionalProperties: true
        error_message:
          type: string
        log_excerpt:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
    OperationStep:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
          nullable: true
        step_key:
          type: string
        step_label:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
        sequence:
          type: integer
        message:
          type: string
          nullable: true
        result_json:
          type: object
          additionalProperties: true
        error_message:
          type: string
          nullable: true
        log_excerpt:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
          nullable: true
    OperationStepStatusResponse:
      type: object
      required:
        - ok
      additionalProperties: false
      properties:
        ok:
          type: boolean
    ListOperationStepsResponse:
      type: object
      required:
        - ok
        - operation_id
        - steps
      additionalProperties: false
      properties:
        ok:
          type: boolean
        operation_id:
          type: string
          format: uuid
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OperationStep"
    SavePlatformDeploySecretsRequest:
      type: object
      required:
        - tfe_token
        - tfe_agent_pool_id
        - tfe_organization
        - cloudflare_token
        - cloudflare_account_id
        - cloudflare_zone_id
        - github_auth_mode
      additionalProperties: false
      properties:
        tfe_token:
          type: string
          minLength: 1
        tfe_agent_pool_id:
          type: string
          minLength: 1
        tfe_organization:
          type: string
          minLength: 1
        cloudflare_token:
          type: string
          minLength: 1
        cloudflare_account_id:
          type: string
          minLength: 1
        cloudflare_zone_id:
          type: string
          minLength: 1
        github_token:
          type: string
        github_auth_mode:
          type: string
          enum:
            - token
            - github_app
        github_app_id:
          type: string
        github_app_installation_id:
          type: string
        github_app_private_key:
          type: string
    GetPlatformDeploySecretsResponse:
      type: object
      required:
        - ok
        - values_returned
        - values_redacted
        - configured_keys
        - tfe_token
        - tfe_agent_pool_id
        - tfe_organization
        - cloudflare_token
        - cloudflare_account_id
        - cloudflare_zone_id
        - github_auth_mode
        - github_token
        - github_app_id
        - github_app_installation_id
        - github_app_private_key
      additionalProperties: false
      properties:
        ok:
          type: boolean
        values_returned:
          type: boolean
        values_redacted:
          type: boolean
        configured_keys:
          type: array
          items:
            type: string
        tfe_token:
          type: string
        tfe_agent_pool_id:
          type: string
        tfe_organization:
          type: string
        cloudflare_token:
          type: string
        cloudflare_account_id:
          type: string
        cloudflare_zone_id:
          type: string
        github_token:
          type: string
        github_auth_mode:
          type: string
          enum:
            - token
            - github_app
        github_app_id:
          type: string
        github_app_installation_id:
          type: string
        github_app_private_key:
          type: string
          description: Always blank in read responses; use configured_keys to see whether this secret exists.
    SavePlatformDeploySecretsResponse:
      type: object
      required:
        - ok
        - vault_paths
        - saved_keys
        - saved_keys_by_path
      additionalProperties: false
      properties:
        ok:
          type: boolean
        vault_paths:
          type: array
          items:
            type: string
        saved_keys:
          type: array
          items:
            type: string
        saved_keys_by_path:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            status:
              type: integer
