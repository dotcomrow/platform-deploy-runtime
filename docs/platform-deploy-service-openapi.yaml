openapi: 3.0.3
info:
  title: Platform Deploy API
  version: 1.0.0
  description: Internal Kubernetes control plane for Directus-managed shell app deployments.
servers:
  - url: http://platform-deploy-service.directus.svc.cluster.local:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Service health
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: Dependency readiness
  /internal/apps/{id}/deploy:
    post:
      operationId: queueDeploy
      parameters:
        - $ref: "#/components/parameters/AppIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueDeployRequest"
      responses:
        "200":
          description: Deploy queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueOperationResponse"
        "422":
          description: Deploy configuration is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/apps/{id}/destroy:
    post:
      operationId: queueDestroy
      parameters:
        - $ref: "#/components/parameters/AppIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueDestroyRequest"
      responses:
        "200":
          description: Destroy queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueOperationResponse"
  /internal/secrets/platform-deploy:
    get:
      operationId: getPlatformDeploySecrets
      responses:
        "200":
          description: Platform deploy secrets loaded from Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlatformDeploySecretsResponse"
    post:
      operationId: savePlatformDeploySecrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePlatformDeploySecretsRequest"
      responses:
        "200":
          description: Platform deploy secrets saved to Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavePlatformDeploySecretsResponse"
        "422":
          description: One or more required secret fields are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    AppIdPath:
      name: id
      in: path
      required: true
      description: Directus platform_apps id.
      schema:
        type: string
        format: uuid
  schemas:
    QueueDeployRequest:
      type: object
      additionalProperties: false
      properties:
        operation_type:
          type: string
          enum:
            - create
            - update
            - redeploy
          description: Deployment operation to queue.
    QueueDestroyRequest:
      type: object
      additionalProperties: false
      properties:
        operation_type:
          type: string
          enum:
            - destroy
            - delete
          description: Destroy operation to queue.
    QueueOperationResponse:
      type: object
      required:
        - ok
        - app_id
        - operation_id
        - flink_job_id
        - prepared_topic
      additionalProperties: true
      properties:
        ok:
          type: boolean
        app_id:
          type: string
        operation_id:
          type: string
        flink_job_id:
          type: string
        prepared_topic:
          type: string
    SavePlatformDeploySecretsRequest:
      type: object
      required:
        - tfe_token
        - tfe_agent_pool_id
        - tfe_organization
        - cloudflare_token
        - cloudflare_account_id
        - cloudflare_zone_id
        - github_token
      additionalProperties: false
      properties:
        tfe_token:
          type: string
          minLength: 1
        tfe_agent_pool_id:
          type: string
          minLength: 1
        tfe_organization:
          type: string
          minLength: 1
        cloudflare_token:
          type: string
          minLength: 1
        cloudflare_account_id:
          type: string
          minLength: 1
        cloudflare_zone_id:
          type: string
          minLength: 1
        github_token:
          type: string
          minLength: 1
    GetPlatformDeploySecretsResponse:
      type: object
      required:
        - ok
        - values_returned
        - values_redacted
        - configured_keys
        - tfe_token
        - tfe_agent_pool_id
        - tfe_organization
        - cloudflare_token
        - cloudflare_account_id
        - cloudflare_zone_id
        - github_token
      additionalProperties: false
      properties:
        ok:
          type: boolean
        values_returned:
          type: boolean
        values_redacted:
          type: boolean
        configured_keys:
          type: array
          items:
            type: string
        tfe_token:
          type: string
        tfe_agent_pool_id:
          type: string
        tfe_organization:
          type: string
        cloudflare_token:
          type: string
        cloudflare_account_id:
          type: string
        cloudflare_zone_id:
          type: string
        github_token:
          type: string
    SavePlatformDeploySecretsResponse:
      type: object
      required:
        - ok
        - vault_paths
        - saved_keys
        - saved_keys_by_path
      additionalProperties: false
      properties:
        ok:
          type: boolean
        vault_paths:
          type: array
          items:
            type: string
        saved_keys:
          type: array
          items:
            type: string
        saved_keys_by_path:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            status:
              type: integer
